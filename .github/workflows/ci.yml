name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate data files, manifest, and i18n parity
        run: node scripts/validate-data.mjs

      - name: Detection smoke tests (all three layers)
        run: node scripts/smoke-test.mjs

      - name: Install jsdom (webmail DOM test only)
        run: npm install --no-save jsdom

      - name: Webmail scanner DOM test
        run: node scripts/mail-dom-test.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Ensure Xvfb is available (headed Chromium needs a display for MV3 extensions)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: End-to-end extension tests
        run: node scripts/e2e.mjs

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build extension zip
        run: bash scripts/build-zip.sh
      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: canadian-scam-shield
          path: dist/canadian-scam-shield.zip
          if-no-files-found: error
