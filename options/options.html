<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Scam Shield — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>

  <main class="page" role="main">

    <!-- Page heading -->
    <h1 class="page__heading" id="page-title"></h1>

    <!-- ===================================================
         SECTION 1: Language
         =================================================== -->
    <section class="section" aria-labelledby="lang-heading">
      <h2 class="section__heading" id="lang-heading"></h2>

      <div class="radio-group" role="radiogroup" aria-labelledby="lang-heading">

        <label class="radio-label">
          <input
            type="radio"
            name="language"
            value="en"
            id="lang-en"
            class="radio-input"
          >
          <span class="radio-text" id="label-lang-en"></span>
        </label>

        <label class="radio-label">
          <input
            type="radio"
            name="language"
            value="fr"
            id="lang-fr"
            class="radio-input"
          >
          <span class="radio-text" id="label-lang-fr"></span>
        </label>

      </div>
    </section>

    <!-- ===================================================
         SECTION 2: Personal whitelist
         =================================================== -->
    <section class="section" aria-labelledby="whitelist-heading">
      <h2 class="section__heading" id="whitelist-heading"></h2>
      <p class="section__desc" id="whitelist-desc"></p>

      <!-- Add domain form -->
      <div class="whitelist-add-row">
        <label for="whitelist-input" class="sr-only" id="whitelist-input-label"></label>
        <input
          type="text"
          id="whitelist-input"
          class="text-input"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          inputmode="url"
        >
        <button id="whitelist-add-btn" class="btn btn--primary"></button>
      </div>

      <!-- Error message for invalid domain -->
      <p id="whitelist-error" class="field-error" hidden aria-live="polite"></p>

      <!-- Current whitelist entries -->
      <ul id="whitelist-list" class="domain-list" aria-label="Trusted sites list" aria-live="polite"></ul>
    </section>

    <!-- ===================================================
         SECTION: Shield Pro
         =================================================== -->
    <section class="section" id="pro-section" aria-labelledby="pro-heading">
      <h2 class="section__heading" id="pro-heading"></h2>
      <p class="section__desc" id="pro-desc"></p>

      <p id="pro-status" class="pro-status" aria-live="polite"></p>

      <div class="whitelist-add-row">
        <label for="pro-license" class="sr-only" id="pro-license-label"></label>
        <input type="text" id="pro-license" class="text-input" autocomplete="off"
               autocapitalize="characters" spellcheck="false">
        <button id="pro-activate-btn" class="btn btn--primary"></button>
      </div>

      <button id="pro-upgrade-btn" class="btn btn--upgrade"></button>
      <p id="pro-upgrade-note" class="field-error" hidden></p>
    </section>

    <!-- ===================================================
         SECTION: Sensitivity (Pro-gated)
         =================================================== -->
    <section class="section pro-gated" id="sensitivity-section" aria-labelledby="sensitivity-heading">
      <h2 class="section__heading" id="sensitivity-heading">
        <span id="sensitivity-heading-text"></span>
        <span class="pro-lock" id="sensitivity-lock"></span>
      </h2>
      <p class="section__desc" id="sensitivity-desc"></p>

      <div class="radio-group" role="radiogroup" aria-labelledby="sensitivity-heading">
        <label class="radio-label">
          <input type="radio" name="sensitivity" value="strict" id="sens-strict" class="radio-input">
          <span class="radio-text" id="label-sens-strict"></span>
        </label>
        <label class="radio-label">
          <input type="radio" name="sensitivity" value="balanced" id="sens-balanced" class="radio-input">
          <span class="radio-text" id="label-sens-balanced"></span>
        </label>
        <label class="radio-label">
          <input type="radio" name="sensitivity" value="permissive" id="sens-permissive" class="radio-input">
          <span class="radio-text" id="label-sens-permissive"></span>
        </label>
      </div>
    </section>

    <!-- ===================================================
         SECTION: Blocked sites (Pro-gated)
         =================================================== -->
    <section class="section pro-gated" id="blocklist-section" aria-labelledby="blocklist-heading">
      <h2 class="section__heading" id="blocklist-heading">
        <span id="blocklist-heading-text"></span>
        <span class="pro-lock" id="blocklist-lock"></span>
      </h2>
      <p class="section__desc" id="blocklist-desc"></p>

      <div class="whitelist-add-row">
        <label for="blocklist-input" class="sr-only" id="blocklist-input-label"></label>
        <input type="text" id="blocklist-input" class="text-input" autocomplete="off"
               autocapitalize="off" spellcheck="false" inputmode="url">
        <button id="blocklist-add-btn" class="btn btn--primary"></button>
      </div>
      <p id="blocklist-error" class="field-error" hidden aria-live="polite"></p>
      <ul id="blocklist-list" class="domain-list" aria-label="Blocked sites list" aria-live="polite"></ul>
    </section>

    <!-- ===================================================
         SECTION: PhishTank (Pro-gated)
         =================================================== -->
    <section class="section pro-gated" id="phishtank-section" aria-labelledby="phishtank-heading">
      <h2 class="section__heading" id="phishtank-heading">
        <span id="phishtank-heading-text"></span>
        <span class="pro-lock" id="phishtank-lock"></span>
      </h2>
      <label class="checkbox-label">
        <input type="checkbox" id="phishtank-toggle" class="checkbox-input">
        <span id="phishtank-label"></span>
      </label>
      <p id="phishtank-note" class="section__desc"></p>
    </section>

    <!-- ===================================================
         SECTION 3: Info
         =================================================== -->
    <section class="section section--info" aria-labelledby="info-heading">
      <h2 class="section__heading sr-only" id="info-heading">About</h2>

      <p class="info-line">
        <span id="version-label"></span>
        <span id="version-value" class="info-line__value"></span>
      </p>

      <p id="privacy-summary" class="privacy-text"></p>

      <p class="info-line">
        <a id="cafc-link" class="link" target="_blank" rel="noopener noreferrer"></a>
      </p>

      <p class="info-line">
        <span id="data-updated-label"></span>
        <span id="data-updated-value" class="info-line__value"></span>
      </p>
      <button id="update-now-btn" class="btn btn--secondary"></button>

    </section>

    <!-- Saved confirmation — aria-live so screen readers announce it -->
    <div id="saved-confirm" class="saved-confirm" hidden aria-live="polite" role="status"></div>

  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
